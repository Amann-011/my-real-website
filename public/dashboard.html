<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard | MyWebsite</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="navbar">
    <div class="logo">MyWebsite</div>

    <div class="nav-actions">
      <button id="themeBtn" class="icon-btn">🌙</button>
      <button id="logoutBtn" class="btn">Logout</button>
    </div>
  </header>

  <main class="dashboard">

    <section class="welcome-section">
      <div>
        <p class="badge">PERSONAL DASHBOARD</p>

        <h1>
          Welcome back, <span id="userName">User</span> 👋
        </h1>

        <p>
          Manage your account and explore your dashboard.
        </p>
      </div>
    </section>

    <section class="dashboard-grid">

      <div class="dashboard-card profile-card">

        <div class="profile-avatar" id="avatar">
          U
        </div>

        <h2 id="profileName">Loading...</h2>

        <p id="userEmail">Loading...</p>

        <div class="status">
          <span></span>
          Active Account
        </div>

      </div>

      <div class="dashboard-card">

        <div class="card-icon">📅</div>

        <h3>Account Created</h3>

        <p id="createdAt">Loading...</p>

      </div>

      <div class="dashboard-card">

        <div class="card-icon">🔐</div>

        <h3>Security</h3>

        <p>Your account is protected.</p>

        <button class="small-btn" id="settingsBtn">
          Account Settings
        </button>

      </div>

    </section>

    <section class="dashboard-card activity-card">

      <h2>Quick Actions</h2>

      <div class="quick-actions">

        <button class="action-btn">
          👤
          <span>My Profile</span>
        </button>

        <button class="action-btn">
          ⚙️
          <span>Settings</span>
        </button>

        <button class="action-btn">
          🎁
          <span>My Gift</span>
        </button>

      </div>

    </section>

  </main>

  <script>
    async function loadUser() {

      try {

        const response = await fetch("/api/me", {
          credentials: "include"
        });

        if (!response.ok) {
          window.location.href = "/login.html";
          return;
        }

        const data = await response.json();
        const user = data.user;

        document.getElementById("userName").textContent =
          user.name;

        document.getElementById("profileName").textContent =
          user.name;

        document.getElementById("userEmail").textContent =
          user.email;

        document.getElementById("avatar").textContent =
          user.name.charAt(0).toUpperCase();

        const date = new Date(user.created_at);

        document.getElementById("createdAt").textContent =
          date.toLocaleDateString("en-IN", {
            day: "numeric",
            month: "long",
            year: "numeric"
          });

      } catch (error) {

        window.location.href = "/login.html";

      }
    }

    document
      .getElementById("logoutBtn")
      .addEventListener("click", async () => {

        await fetch("/api/logout", {
          method: "POST",
          credentials: "include"
        });

        window.location.href = "/";
      });


    const themeBtn = document.getElementById("themeBtn");

    themeBtn.addEventListener("click", () => {

      document.body.classList.toggle("dark-mode");

      if (document.body.classList.contains("dark-mode")) {
        themeBtn.textContent = "☀️";
        localStorage.setItem("theme", "dark");
      } else {
        themeBtn.textContent = "🌙";
        localStorage.setItem("theme", "light");
      }

    });


    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark-mode");
      themeBtn.textContent = "☀️";
    }


    loadUser();
  </script>

</body>
</html>
